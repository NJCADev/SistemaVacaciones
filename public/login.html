<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Vacaciones CUC</title>
  <!-- NUEVAS LÍNEAS -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <!-- FIN NUEVAS LÍNEAS -->
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #1a56db;
      --accent-hover: #1344b8;
      --accent-light: #e8f0fe;
      --text: #1a1f2e;
      --text-2: #4a5568;
      --text-3: #8896a5;
      --border: #e2e6ea;
      --danger: #c0392b;
      --danger-light: #fdf0ef;
      --radius: 10px;
      --radius-sm: 6px;
    }
    body {
      font-family: 'Sora', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    /* Background decoration */
    body::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 0%, rgba(26,86,219,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 80% 100%, rgba(26,86,219,0.06) 0%, transparent 70%);
    }
    .login-wrap {
      width: 100%; max-width: 420px;
      padding: 20px;
      position: relative; z-index: 1;
    }
    .login-header {
      text-align: center; margin-bottom: 32px;
    }
    .login-logo {
      display: inline-flex; align-items: center; justify-content: center;
      width: 56px; height: 56px; border-radius: 14px;
      background: var(--accent); margin-bottom: 16px;
    }
    .login-logo svg { width: 28px; height: 28px; stroke: #fff; }
    .login-header h1 { font-size: 22px; font-weight: 700; color: var(--text); }
    .login-header p { font-size: 13px; color: var(--text-3); margin-top: 4px; }

    .login-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08), 0 4px 10px rgba(0,0,0,0.04);
      padding: 32px;
    }

    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--text-2); margin-bottom: 6px;
    }
    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--text-3);
    }
    .input-icon svg { width: 15px; height: 15px; }
    .form-control {
      width: 100%; padding: 10px 13px 10px 38px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-family: 'Sora', sans-serif; font-size: 13px; color: var(--text);
      background: #fff; transition: border 0.15s; outline: none;
    }
    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(26,86,219,0.1);
    }

    .alert {
      padding: 11px 14px; border-radius: var(--radius-sm);
      font-size: 13px; margin-bottom: 18px; display: none;
      background: var(--danger-light); color: var(--danger);
      border: 1px solid #f5c6c2;
    }
    .alert.show { display: block; }

    .btn-login {
      width: 100%; padding: 11px;
      background: var(--accent); color: #fff; border: none;
      border-radius: var(--radius-sm); font-family: 'Sora', sans-serif;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background 0.15s; display: flex;
      align-items: center; justify-content: center; gap: 8px;
    }
    .btn-login:hover { background: var(--accent-hover); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .login-footer {
      text-align: center; margin-top: 20px;
      font-size: 11px; color: var(--text-3);
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-header">
      <div class="login-logo">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="2" y="7" width="20" height="14" rx="2"/>
          <path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/>
          <line x1="12" y1="12" x2="12" y2="16"/>
          <line x1="10" y1="14" x2="14" y2="14"/>
        </svg>
      </div>
      <h1>Vacaciones CUC</h1>
      <p>Sistema de Gestión de Vacaciones</p>
    </div>

    <div class="login-card">
      <div class="alert" id="alert"></div>

      <div class="form-group">
        <label class="form-label" for="cedula">Número de Cédula</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
              <line x1="2" y1="10" x2="22" y2="10"/>
            </svg>
          </span>
          <input id="cedula" class="form-control" type="text"
            placeholder="ej. 1-0000-0000" autocomplete="username"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
          </span>
          <input id="password" class="form-control" type="password"
            placeholder="••••••••" autocomplete="current-password"/>
        </div>
      </div>

      <button class="btn-login" id="loginBtn" onclick="doLogin()">
        Ingresar al Sistema
      </button>
    </div>

    <div class="login-footer">Sistema interno · Uso exclusivo CUC</div>
  </div>

  <script>
    // Redirect if already logged in
    fetch('/api/session').then(r => {
      if (r.ok) window.location.href = '/dashboard';
    }).catch(() => {});

    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
    document.getElementById('cedula').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('password').focus();
    });

    async function doLogin() {
      const cedula = document.getElementById('cedula').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const alert = document.getElementById('alert');

      alert.classList.remove('show');

      if (!cedula || !password) {
        alert.textContent = 'Por favor complete todos los campos.';
        alert.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Ingresando...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cedula, password })
        });
        const data = await res.json();
        if (!res.ok) {
          alert.textContent = data.error || 'Credenciales inválidas.';
          alert.classList.add('show');
          btn.disabled = false;
          btn.innerHTML = 'Ingresar al Sistema';
        } else {
          window.location.href = '/dashboard';
        }
      } catch {
        alert.textContent = 'Error de conexión. Intente de nuevo.';
        alert.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = 'Ingresar al Sistema';
      }
    }
  </script>
</body>
</html>
