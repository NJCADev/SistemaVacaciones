<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Usuarios — Vacaciones CUC</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div id="sidebar" class="sidebar"></div>

  <main class="main">
    <div class="topbar">
      <span class="topbar-title">Gestión de Usuarios</span>
      <div class="topbar-actions">
        <button class="btn btn-primary" onclick="openModal('userModal')">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:14px;height:14px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nuevo Usuario
        </button>
      </div>
    </div>

    <div class="content">
      <div class="flex items-center gap-2 mb-4">
        <input type="text" id="search" class="form-control" style="max-width:300px"
          placeholder="Buscar por nombre, cédula o email..." oninput="renderTable()"/>
        <button class="btn btn-secondary btn-sm" onclick="clearSearch()">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:12px;height:12px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Limpiar
        </button>
        <span id="countLabel" class="text-sm text-muted"></span>
      </div>

      <div class="card">
        <div id="loadingState" class="loading"><div class="spinner"></div></div>
        <div class="table-wrap" id="tableWrap" style="display:none">
          <table>
            <thead>
              <tr>
                <th>Cédula</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Departamento</th>
                <th>Tipo Nombramiento</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div id="emptyState" class="empty-state" style="display:none">
          <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="width:48px;height:48px;margin:0 auto 12px;display:block;opacity:.3"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          <p>No hay usuarios que mostrar.</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal Nuevo Usuario -->
  <div class="modal-overlay" id="userModal">
    <div class="modal" style="max-width:540px">
      <div class="modal-header">
        <span class="modal-title">Nuevo Usuario</span>
        <button class="modal-close" onclick="closeModal('userModal')">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:16px;height:16px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="userAlert" class="alert"></div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="uCedula">Cédula *</label>
            <input type="text" id="uCedula" class="form-control" placeholder="1-0000-0000"/>
          </div>
          <div class="form-group">
            <label class="form-label" for="uEmail">Correo *</label>
            <input type="email" id="uEmail" class="form-control" placeholder="correo@cuc.ac.cr"/>
          </div>
          <div class="form-group">
            <label class="form-label" for="uNombre">Nombre *</label>
            <input type="text" id="uNombre" class="form-control"/>
          </div>
          <div class="form-group">
            <label class="form-label" for="uApellidos">Apellidos *</label>
            <input type="text" id="uApellidos" class="form-control"/>
          </div>
          <div class="form-group">
            <label class="form-label" for="uPassword">Contraseña *</label>
            <input type="password" id="uPassword" class="form-control" placeholder="Mínimo 8 caracteres"/>
          </div>
          <div class="form-group">
            <label class="form-label" for="uRol">Rol *</label>
            <select id="uRol" class="form-control">
              <option value="">Seleccione...</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="uDep">Departamento *</label>
            <select id="uDep" class="form-control">
              <option value="">Seleccione...</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="uTipo">Tipo de Nombramiento *</label>
            <select id="uTipo" class="form-control">
              <option value="">Seleccione...</option>
            </select>
          </div>
        </div>
        <div style="font-size:11px;color:var(--text-3);padding:8px 12px;background:var(--surface-2);border-radius:6px">
          Se creará con saldo calculado según reglas institucionales.
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('userModal')">Cancelar</button>
        <button class="btn btn-primary" id="saveUserBtn" onclick="saveUser()">Crear Usuario</button>
      </div>
    </div>
  </div>

  <!-- Modal Cambiar Rol -->
<div class="modal-overlay" id="rolModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Cambiar Rol de Usuario</span>
      <button class="modal-close" onclick="closeModal('rolModal')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:16px;height:16px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div id="rolAlert" class="alert"></div>
      <div style="margin-bottom:16px;background:var(--surface-2);padding:12px;border-radius:8px">
        <div><strong id="infoUsuario"></strong></div>
        <div class="text-sm text-muted" id="infoCedula"></div>
      </div>
      <div class="form-group">
        <label class="form-label" for="selectRol">Nuevo Rol *</label>
        <select id="selectRol" class="form-control">
          <option value="">Cargando roles...</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="vigenciaDesde">Vigencia desde (opcional)</label>
        <input type="date" id="vigenciaDesde" class="form-control"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="vigenciaHasta">Vigencia hasta (opcional)</label>
        <input type="date" id="vigenciaHasta" class="form-control"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="adminPassword">Su contraseña (confirmación) *</label>
        <input type="password" id="adminPassword" class="form-control" placeholder="Contraseña del administrador"/>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('rolModal')">Cancelar</button>
      <button class="btn btn-primary" id="btnCambiarRol" onclick="cambiarRol()">Guardar Cambios</button>
    </div>
  </div>
</div>

<!-- Modal Unidades a Cargo -->
<div class="modal-overlay" id="unidadesModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Gestionar Unidades a Cargo de <span id="nombreJefaturaUnidades"></span></span>
      <button class="modal-close" onclick="closeModal('unidadesModal')">&times;</button>
    </div>
    <div class="modal-body">
      <div id="unidadesAlert" class="alert"></div>
      <div class="form-group">
        <label class="form-label">Asignar nuevo departamento</label>
        <div class="flex gap-2">
          <select id="selectDepartamento" class="form-control" style="flex:1">
            <option value="">Cargando...</option>
          </select>
          <button class="btn btn-primary" onclick="asignarUnidad()">Asignar</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Unidades actualmente asignadas</label>
        <div id="listaUnidades" style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:6px">
          <div class="loading">Cargando...</div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('unidadesModal')">Cerrar</button>
    </div>
  </div>
</div>

  <script src="/app.js"></script>
  <script>
    let allUsers = [];
    let usuarioSeleccionadoId = null;
    let jefaturaSeleccionadaId = null;

    function clearSearch() {
      document.getElementById('search').value = '';
      renderTable();
    }

    function renderTable() {
      const q = document.getElementById('search').value.toLowerCase();
      const data = q ? allUsers.filter(u =>
        (u.nombre || '').toLowerCase().includes(q) ||
        (u.apellidos || '').toLowerCase().includes(q) ||
        (u.cedula || '').toLowerCase().includes(q) ||
        (u.email || '').toLowerCase().includes(q)
      ) : allUsers;

      document.getElementById('countLabel').textContent = `${data.length} usuario${data.length !== 1 ? 's' : ''}`;

      if (!data.length) {
        document.getElementById('tableWrap').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
        return;
      }
      document.getElementById('tableWrap').style.display = 'block';
      document.getElementById('emptyState').style.display = 'none';

      // Obtener ID del usuario actual (si está cargado)
      const currentUserId = currentUser ? currentUser.id : null;

      document.getElementById('tableBody').innerHTML = data.map(u => {
        const esUsuarioActual = (u.id_usuario === currentUserId);

        return `
          <tr>
            <td class="font-mono text-sm">${u.cedula || ''}</td>
            <td><strong>${u.nombre || ''} ${u.apellidos || ''}</strong></td>
            <td class="text-sm text-muted">${u.email || '—'}</td>
            <td><span class="role-badge">${u.rol || ''}</span></td>
            <td class="text-sm">${u.departamento || ''}</td>
            <td class="text-sm text-muted">${u.tipo_nombramiento || ''}</td>
            <td>
              <span class="badge ${u.activo ? 'badge-approved' : 'badge-rejected'}">
                ${u.activo ? 'Activo' : 'Inactivo'}
              </span>
            </td>
            <td>
              ${!esUsuarioActual ? `
                <button class="btn btn-sm btn-secondary" onclick="recalcularSaldo(${u.id_usuario})" title="Recalcular saldo">
                  <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:12px;height:12px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                </button>
                <button class="btn btn-sm btn-primary" onclick="abrirModalCambioRol(${u.id_usuario}, '${u.nombre} ${u.apellidos}', '${u.cedula}')" title="Cambiar rol">
                  <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M12 20h9M16.5 3.5L20 7l-9 9-4 1 1-4 9-9z"/></svg>
                </button>
                <button class="btn btn-sm btn-info" onclick="abrirModalUnidades(${u.id_usuario}, '${u.nombre} ${u.apellidos}')" title="Gestionar unidades a cargo">
                  <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:12px;height:12px"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
                </button>
              ` : `<span class="text-muted text-sm">—</span>`}
            </td>
          </tr>
        `;
      }).join('');
    }

    async function abrirModalCambioRol(id, nombreCompleto, cedula) {
      usuarioSeleccionadoId = id;
      document.getElementById('infoUsuario').textContent = nombreCompleto;
      document.getElementById('infoCedula').textContent = `Cédula: ${cedula}`;
      
      // Cargar roles en el select
      try {
        const res = await fetch('/api/roles');
        const roles = await res.json();
        const select = document.getElementById('selectRol');
        select.innerHTML = roles.map(r => `<option value="${r.id_rol}">${r.nombre}</option>`).join('');
      } catch (err) {
        console.error('Error cargando roles:', err);
      }
      
      // Limpiar campos
      document.getElementById('vigenciaDesde').value = '';
      document.getElementById('vigenciaHasta').value = '';
      document.getElementById('adminPassword').value = '';
      document.getElementById('rolAlert').classList.remove('show');
      
      openModal('rolModal');
    }

    async function cambiarRol() {
      const nuevoRolId = document.getElementById('selectRol').value;
      const vigenciaDesde = document.getElementById('vigenciaDesde').value;
      const vigenciaHasta = document.getElementById('vigenciaHasta').value;
      const passwordConfirm = document.getElementById('adminPassword').value;
      const alert = document.getElementById('rolAlert');
      
      alert.classList.remove('show');
      
      if (!nuevoRolId) {
        alert.textContent = 'Debe seleccionar un rol.';
        alert.className = 'alert alert-error show';
        return;
      }
      if (!passwordConfirm) {
        alert.textContent = 'Debe ingresar su contraseña para confirmar.';
        alert.className = 'alert alert-error show';
        return;
      }
      
      const btn = document.getElementById('btnCambiarRol');
      btn.disabled = true;
      btn.textContent = 'Procesando...';
      
      try {
        console.log('Enviando:', {
          nuevo_rol_id: nuevoRolId,
          password_confirmacion: passwordConfirm,
          vigencia_desde: vigenciaDesde,
          vigencia_hasta: vigenciaHasta
        });
        const res = await fetch(`/api/usuarios/${usuarioSeleccionadoId}/rol`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nuevo_rol_id: parseInt(nuevoRolId),   // Asegurar que sea número
            password_confirmacion: passwordConfirm,
            vigencia_desde: vigenciaDesde || null,
            vigencia_hasta: vigenciaHasta || null
          })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          alert.textContent = 'Rol actualizado correctamente.';
          alert.className = 'alert alert-success show';
          closeModal('rolModal');
          await loadUsers(); // Recargar lista de usuarios
        } else {
          alert.textContent = data.error || 'Error al cambiar rol.';
          alert.className = 'alert alert-error show';
        }
      } catch (error) {
        console.error('Error:', error);
        alert.textContent = 'Error de conexión.';
        alert.className = 'alert alert-error show';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Guardar Cambios';
      }
    }

    async function abrirModalUnidades(id, nombre) {
      jefaturaSeleccionadaId = id;
      document.getElementById('nombreJefaturaUnidades').textContent = nombre;
      document.getElementById('unidadesAlert').classList.remove('show');
      
      // Cargar lista de departamentos disponibles (todos los activos)
      const depsRes = await fetch('/api/departamentos');
      const deps = await depsRes.json();
      const select = document.getElementById('selectDepartamento');
      select.innerHTML = '<option value="">Seleccione un departamento</option>' +
        deps.map(d => `<option value="${d.id_departamento}">${d.nombre}</option>`).join('');
      
      await cargarUnidadesAsignadas();
      openModal('unidadesModal');
    }

    async function cargarUnidadesAsignadas() {
      const lista = document.getElementById('listaUnidades');
      lista.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
      const res = await fetch(`/api/usuarios/${jefaturaSeleccionadaId}/unidades`);
      const unidades = await res.json();
      if (unidades.length === 0) {
        lista.innerHTML = '<div class="text-muted text-sm" style="padding:12px">No tiene unidades asignadas.</div>';
        return;
      }
      lista.innerHTML = unidades.map(u => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border)">
          <span><strong>${u.codigo_unico_4_digitos}</strong> - ${u.nombre_unidad}</span>
          <button class="btn btn-sm btn-danger" onclick="eliminarUnidad(${u.id_departamento})" title="Quitar">✕</button>
        </div>
      `).join('');
    }

    async function asignarUnidad() {
      const select = document.getElementById('selectDepartamento');
      const idDepto = select.value;
      if (!idDepto) {
        alert('Seleccione un departamento');
        return;
      }
      const res = await fetch(`/api/usuarios/${jefaturaSeleccionadaId}/unidades`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id_departamento: parseInt(idDepto) })
      });
      const data = await res.json();
      if (res.ok) {
        select.value = '';
        cargarUnidadesAsignadas();
      } else {
        const alert = document.getElementById('unidadesAlert');
        alert.textContent = data.error;
        alert.className = 'alert alert-error show';
      }
    }

    async function eliminarUnidad(idDepto) {
      if (!confirm('¿Quitar esta unidad de la jefatura?')) return;
      const res = await fetch(`/api/usuarios/${jefaturaSeleccionadaId}/unidades/${idDepto}`, {
        method: 'DELETE'
      });
      if (res.ok) {
        cargarUnidadesAsignadas();
      } else {
        alert('Error al eliminar');
      }
    }

    async function recalcularSaldo(idUsuario) {
      if (!confirm('¿Está seguro de recalcular el saldo de vacaciones para este usuario?')) return;
      try {
        const res = await fetch(`/api/saldo/recalcular/${idUsuario}`, { method: 'POST' });
        const data = await res.json();
        if (res.ok) {
          alert(`Saldo recalculado correctamente.\nSaldo actual: ${data.saldo.saldo_actual} días.`);
        } else {
          alert('Error: ' + (data.error || 'No se pudo recalcular'));
        }
      } catch (err) {
        alert('Error de conexión');
      }
    }

    async function saveUser() {
      const body = {
        cedula: document.getElementById('uCedula').value.trim(),
        nombre: document.getElementById('uNombre').value.trim(),
        apellidos: document.getElementById('uApellidos').value.trim(),
        email: document.getElementById('uEmail').value.trim(),
        password: document.getElementById('uPassword').value,
        id_rol: document.getElementById('uRol').value,
        id_departamento: document.getElementById('uDep').value,
        id_tipo_nombramiento: document.getElementById('uTipo').value,
      };

      const alert = document.getElementById('userAlert');
      alert.classList.remove('show');

      // Validación de campos obligatorios
      if (!body.cedula || !body.nombre || !body.apellidos || !body.email || !body.password || !body.id_rol || !body.id_departamento || !body.id_tipo_nombramiento) {
        alert.className = 'alert alert-error show';
        alert.textContent = 'Todos los campos son obligatorios.';
        return;
      }

      // V2: Validar formato de cédula (solo números, 9 a 12 dígitos)
      const cedulaRegex = /^\d{9,12}$/;
      if (!cedulaRegex.test(body.cedula)) {
        alert.className = 'alert alert-error show';
        alert.textContent = 'La cédula debe contener solo números y tener entre 9 y 12 dígitos.';
        return;
      }

      const btn = document.getElementById('saveUserBtn');
      btn.disabled = true;
      btn.textContent = 'Guardando...';

      try {
        const res = await fetch('/api/usuarios', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) {
          alert.className = 'alert alert-error show';
          alert.textContent = data.error || 'Error al crear usuario.';
        } else {
          closeModal('userModal');
          await loadUsers();
        }
      } catch {
        alert.className = 'alert alert-error show';
        alert.textContent = 'Error de conexión.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Crear Usuario';
      }
    }

    async function loadUsers() {
      try {
        const res = await fetch('/api/usuarios');
        if (!res.ok) throw new Error('Error al cargar usuarios');
        allUsers = await res.json();
      } catch (err) {
        console.error(err);
        allUsers = [];
      }
      document.getElementById('loadingState').style.display = 'none';
      renderTable();
    }

    async function loadSelects() {
      try {
        const [rolesRes, depsRes, tiposRes] = await Promise.all([
          fetch('/api/roles'),
          fetch('/api/departamentos'),
          fetch('/api/tipos-nombramiento'),
        ]);
        const roles = await rolesRes.json();
        const deps = await depsRes.json();
        const tipos = await tiposRes.json();

        document.getElementById('uRol').innerHTML = '<option value="">Seleccione...</option>' +
          roles.map(r => `<option value="${r.id_rol}">${r.nombre}</option>`).join('');
        document.getElementById('uDep').innerHTML = '<option value="">Seleccione...</option>' +
          deps.map(d => `<option value="${d.id_departamento}">${d.nombre}</option>`).join('');
        document.getElementById('uTipo').innerHTML = '<option value="">Seleccione...</option>' +
          tipos.map(t => `<option value="${t.id_tipo_nombramiento}">${t.nombre}</option>`).join('');
      } catch (err) {
        console.error('Error cargando selectores:', err);
      }
    }

    async function init() {
      try {
        const user = await loadSession();
        if (!user) return;
        if (!['Recursos Humanos', 'Administrador'].includes(user.rol)) {
          window.location.href = '/dashboard';
          return;
        }
        buildSidebar('usuarios');
        await Promise.all([loadUsers(), loadSelects()]);
      } catch (error) {
        console.error('Error en init:', error);
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
        document.querySelector('#emptyState p').textContent = 'Error al cargar datos.';
      }
    }
    init();
  </script>
</body>
</html>
